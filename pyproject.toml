[project]
name = "content-detective-api"
version = "0.2.0"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.120,<1",
  "uvicorn>=0.35,<1",
  "pandas>=2.2,<3",
  "numpy>=1.26,<3",
  "requests>=2.32,<3",
  "python-dotenv>=1.0,<2",
  "PyYAML>=6,<7",
]

[tool.vercel]
entrypoint = "api.index:app"
